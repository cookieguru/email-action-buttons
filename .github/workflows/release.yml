name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check manifest version
    if: github.repository == 'cookieguru/email-action-buttons'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.manifest.outputs.version }}
      tag: ${{ steps.manifest.outputs.tag }}
      already_released: ${{ steps.tag.outputs.exists }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(jq -r '.version' manifest.json)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid manifest version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version tag exists
        id: tag
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has already been released"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release manifest version
    needs: prepare
    if: needs.prepare.outputs.already_released == 'false'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      XPI: dist/email-action-buttons-${{ needs.prepare.outputs.version }}.xpi

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject placeholder add-on ID
        run: |
          if jq -e '.browser_specific_settings.gecko.id | contains("PLACEHOLDER")' manifest.json >/dev/null; then
            echo "Replace the placeholder add-on ID in manifest.json before releasing."
            exit 1  
          fi

      - name: Lint and test
        run: npm run check

      - name: Build XPI
        run: npm run package:xpi

      - name: Verify XPI contents
        run: |
          EXPECTED='LICENSE
          background.js
          icons/hourglass.svg
          icons/icon.svg
          manifest.json
          parser.js'

          ACTUAL=$(unzip -Z1 "$XPI" | grep -v '/$' | LC_ALL=C sort)

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected XPI contents:"
            echo "$ACTUAL"
            exit 1
          fi

      - name: Check for ATN credentials
        id: atn
        env:
          ATN_JWT_ISSUER: ${{ secrets.ATN_JWT_ISSUER }}
          ATN_JWT_SECRET: ${{ secrets.ATN_JWT_SECRET }}
        run: |
          if [ -n "$ATN_JWT_ISSUER" ] && [ -n "$ATN_JWT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ATN credentials are not set. Upload the XPI from the GitHub release to ATN by hand."
          fi

      - name: Submit update to addons.thunderbird.net
        if: steps.atn.outputs.configured == 'true'
        env:
          ATN_JWT_ISSUER: ${{ secrets.ATN_JWT_ISSUER }}
          ATN_JWT_SECRET: ${{ secrets.ATN_JWT_SECRET }}
        run: bash .github/scripts/submit-to-atn.sh "$XPI"

      - name: Create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $VERSION"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$XPI" \
            --title "Email Action Buttons $VERSION" \
            --generate-notes
